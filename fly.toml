# fly.toml app configuration file generated for ai-bird-secretary on 2026-11-25T20:33:55+02:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ai-bird-secretary'
primary_region = 'ams'

[build]
[deploy]
  release_command = 'npm run db:migrate'
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  timeout = '5s'
  method = 'GET'
  path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
